
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>EXCO BITUNG ONE</title>

  <style>
    :root {
      --orange: #F58220;
      --orange-dark: #B85C08;
      --text: #17212D;
      --muted: #737D8B;
      --border: #D9DEE5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: #fff;
    }

    button, input { font: inherit; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 22px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 540px;
      margin: auto 0;
    }

    .brand { text-align: center; }

    .brand-logo {
      display: block;
      width: min(260px, 68%);
      max-height: 150px;
      object-fit: contain;
      margin: 0 auto 28px;
    }

    .brand-title {
      display: table;
      max-width: 100%;
      margin: 0 auto;
    }

    .brand-title h1 {
      margin: 0;
      color: #101820;
      font-size: clamp(25px, 6.5vw, 44px);
      font-weight: 900;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }

    .title-line {
      display: block;
      width: 100%;
      height: 5px;
      margin: 15px 0 12px;
      border-radius: 99px;
      background: var(--orange);
    }

    .tagline {
      margin: 0;
      font-size: clamp(12px, 3.1vw, 19px);
      line-height: 1.5;
      white-space: nowrap;
    }

    .login-form { margin-top: 48px; }
    .form-group { margin-bottom: 25px; }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 650;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      min-height: 58px;
      padding: 0 15px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      background: #fff;
    }

    .input-wrap:focus-within {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(245,130,32,.12);
    }

    .input-icon {
      flex-shrink: 0;
      width: 23px;
      height: 23px;
      margin-right: 14px;
      color: #7D8794;
    }

    .input-wrap input {
      width: 100%;
      min-width: 0;
      height: 54px;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 16px;
    }

    .input-wrap input::placeholder { color: #929BA8; }

    .password-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 40px;
      margin-left: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #7D8794;
      cursor: pointer;
    }

    .password-toggle svg { width: 22px; height: 22px; }

    .submit-button {
      display: block;
      width: 100%;
      min-height: 60px;
      margin-top: 32px;
      border: 0;
      border-radius: 11px;
      background: var(--orange);
      color: #171717;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-button:hover { background: #F99A3C; }
    .submit-button:disabled { opacity: .7; cursor: wait; }

    .links {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 26px;
    }

    .links a {
      color: var(--orange-dark);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .link-divider {
      width: 1px;
      height: 22px;
      background: var(--orange);
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #FFF4E8;
      color: #7A3B00;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.visible { display: block; }

    .footer {
      width: 100%;
      margin-top: 35px;
      text-align: center;
      color: var(--muted);
    }

    .footer-credit { margin: 0; font-size: 13px; }
    .footer-version { margin: 5px 0 0; font-size: 11px; }

    @media (max-width: 380px) {
      .page { padding-right: 16px; padding-left: 16px; }
      .brand-title h1 { font-size: 24px; letter-spacing: -1px; }
      .tagline { font-size: 12px; }
      .links a { font-size: 13px; }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="login-container" id="loginPage">
      <header class="brand">
        <img
          class="brand-logo"
          src="./Logo.png"
          alt="Logo Partai Buruh"
          onerror="this.style.display='none'"
        >

        <div class="brand-title">
          <h1>EXCO BITUNG ONE</h1>
          <span class="title-line"></span>
        </div>

        <p class="tagline">Satu Sistem, Satu Data, Satu Kemenangan</p>
      </header>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="kta">Nomor KTA</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <circle cx="8" cy="10" r="2"/>
              <path d="M5.5 15c.7-1.5 4.3-1.5 5 0"/>
              <path d="M14 9h4M14 12h4M14 15h3"/>
            </svg>

            <input
              type="text"
              id="kta"
              name="kta"
              placeholder="Masukkan nomor KTA"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="4" y="10" width="16" height="11" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
              <circle cx="12" cy="15" r="1"/>
              <path d="M12 16v2"/>
            </svg>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan kata sandi"
              autocomplete="current-password"
              required
            >

            <button
              class="password-toggle"
              type="button"
              id="togglePassword"
              aria-label="Tampilkan kata sandi"
            >
              <svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="submit-button" id="loginButton" type="submit">
          MASUK
        </button>

        <div class="links">
          <a href="#" id="forgotLink">Lupa Sandi?</a>
          <span class="link-divider"></span>
          <a href="#" id="registerLink">Daftar Anggota Baru</a>
        </div>

        <div class="message" id="message" role="status" aria-live="polite"></div>
      </form>
    </section>

    <footer class="footer">
      <p class="footer-credit">Design &amp; Develop by EXCO Partai Buruh Bitung</p>
      <p class="footer-version">Versi 1.0.0</p>
    </footer>

  </main>

  <script>
    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbwzJAE4WyKP7aovKdRJu3Yovst5NFyywUJMHjBOgMOrrHbRdCaDBYeiewNMRJNbQEg6/exec";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const passwordInput = document.getElementById("password");

    /*
      PEMETAAN ROLE KE DASHBOARD

      Nilai di sebelah kiri harus sesuai dengan role
      yang dikirim oleh backend Apps Script.
    */
    const DASHBOARD_BY_ROLE = {
      "KETUA_BITUNG": "Bitung1.html",
      "KETUA_EXCO_BITUNG": "Bitung1.html",
      "KETUA": "Bitung1.html",

      "SEKRETARIS": "Bitung2.html",
      "SEKRETARIS_BITUNG": "Bitung2.html",
      "SEKRETARIS_EXCO_BITUNG": "Bitung2.html",

      "BENDAHARA": "Bitung3.html",
      "BENDAHARA_BITUNG": "Bitung3.html",
      "BENDAHARA_EXCO_BITUNG": "Bitung3.html",

      "KETUA_PROVINSI": "Sulut1.html",
      "KETUA_EXCO_PROVINSI": "Sulut1.html",
      "SUPER_ADMIN": "Sulut1.html"
    };

    function showMessage(text) {
      message.textContent = text;
      message.classList.add("visible");
    }

    function hideMessage() {
      message.textContent = "";
      message.classList.remove("visible");
    }

    function normalizeRole(role) {
      return String(role || "")
        .trim()
        .toUpperCase()
        .replace(/[\s-]+/g, "_");
    }

    function getDashboardForRole(role) {
      const normalizedRole = normalizeRole(role);
      return DASHBOARD_BY_ROLE[normalizedRole] || null;
    }

    document.getElementById("togglePassword").addEventListener("click", function () {
      passwordInput.type =
        passwordInput.type === "password" ? "text" : "password";
    });

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      hideMessage();

      const nomorKta = document.getElementById("kta").value.trim();
      const password = passwordInput.value;

      if (!nomorKta || !password) {
        showMessage("Nomor KTA dan kata sandi wajib diisi.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "MEMERIKSA...";

      try {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "login",
            nomorKta: nomorKta,
            password: password
          }),
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error("Server mengembalikan status " + response.status);
        }

        const result = await response.json();

        if (result.success && result.token && result.user) {
          const user = result.user;
          const dashboard = getDashboardForRole(user.role);

          /*
            Simpan sesi hanya setelah login berhasil.
            Jika role tidak dikenali, jangan arahkan pengguna
            ke dashboard yang tidak sesuai.
          */
          if (!dashboard) {
            showMessage(
              "Login berhasil, tetapi role akun (" +
              (user.role || "tidak tersedia") +
              ") belum dipetakan ke dashboard. Periksa role di database."
            );
            return;
          }

          sessionStorage.setItem("exco_token", result.token);
          sessionStorage.setItem("exco_user", JSON.stringify(user));

          // Arahkan ke dashboard berdasarkan role akun.
          window.location.href = "./" + dashboard;

        } else {
          showMessage(
            result.message || "Nomor KTA atau kata sandi tidak sesuai."
          );
        }

      } catch (error) {
        console.error("Login error:", error);

        showMessage(
          "Koneksi login gagal dibaca browser. Periksa koneksi backend/CORS. " +
          "Detail: " + (error.message || "Kesalahan jaringan")
        );

      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "MASUK";
      }
    });

    document.getElementById("forgotLink").addEventListener("click", function (event) {
      event.preventDefault();
      showMessage("Fitur lupa kata sandi belum tersedia.");
    });

    document.getElementById("registerLink").addEventListener("click", function (event) {
      event.preventDefault();
      showMessage("Fitur pendaftaran anggota baru belum tersedia.");
    });
  </script>
</body>
</html>
